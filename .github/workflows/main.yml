name: TetraTurk derle
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --org com.tetraturk --project-name tetraturk --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: yt-dlp ve ffmpeg ekle
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          $t = "$rel\tools"
          New-Item -ItemType Directory -Force $t | Out-Null
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$t\yt-dlp.exe"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "$env:TEMP\ff.zip"
          Expand-Archive "$env:TEMP\ff.zip" "$env:TEMP\ff" -Force
          Copy-Item "$env:TEMP\ff\*\bin\ffmpeg.exe","$env:TEMP\ff\*\bin\ffprobe.exe" $t -Force
      - name: Kurulum .exe oluştur
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: TetraTurk-Windows-Kurulum
          path: output/TetraTurk_Kurulum.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TetraTurk-Windows-Tasinabilir
          path: build/windows/x64/runner/Release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --org com.tetraturk --project-name tetraturk --platforms=android .
      - name: Android yamalarını uygula
        run: |
          mkdir -p android/app/src/main/kotlin/com/tetraturk/tetraturk
          cp android_files/MainActivity.kt android/app/src/main/kotlin/com/tetraturk/tetraturk/MainActivity.kt
          python3 - <<'PY'
          import re,glob
          g = glob.glob('android/app/build.gradle*')[0]
          s = open(g).read()
          s = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', s)
          s += '''
          android {
              defaultConfig { ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") } }
              packaging { jniLibs { useLegacyPackaging = true } }
          }
          dependencies {
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.2")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2")
          }
          '''.replace('\n          ', '\n')
          open(g, 'w').write(s)
          m = 'android/app/src/main/AndroidManifest.xml'
          x = open(m).read()
          if 'permission.INTERNET' not in x:
              x = x.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          open(m, 'w').write(x)
          PY
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: TetraTurk-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
